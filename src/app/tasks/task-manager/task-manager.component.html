<section class="content-panel" aria-labelledby="task-manager-heading">
  <div class="content-panel__header">
    <div>
      <p class="eyebrow">Dashboard</p>
      <h1 id="task-manager-heading">Task Manager</h1>
    </div>
    <button type="button" class="btn btn-primary" (click)="openCreateForm()">Add Task</button>
  </div>

  @if (isFormOpen()) {
    <div #formScrollTarget class="task-form-anchor">
      <app-task-form
        [task]="editingTask()"
        (save)="saveTask($event)"
        (cancel)="closeForm()"
      />
    </div>
  }

  <app-task-list
    [tasks]="tasks()"
    (editTask)="openEditForm($event)"
    (deleteTask)="openDeleteConfirmation($event)"
  />
</section>

@if (taskPendingDelete(); as task) {
  <div class="confirm-backdrop">
    <section
      class="confirm-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-task-heading"
    >
      <h2 id="delete-task-heading">Delete task?</h2>
      <p>
        Delete <strong>{{ task.title }}</strong>? This action cannot be undone.
      </p>
      <div class="confirm-dialog__actions">
        <button type="button" class="btn btn-outline-secondary" (click)="closeDeleteConfirmation()">
          Cancel
        </button>
        <button type="button" class="btn btn-danger" (click)="confirmDeleteTask()">
          Delete
        </button>
      </div>
    </section>
  </div>
}
