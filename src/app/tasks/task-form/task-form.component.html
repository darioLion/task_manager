<form class="task-form" [formGroup]="form" (ngSubmit)="submitForm()">
  <div class="task-form__header">
    <h2>{{ formTitle() }}</h2>
    <button type="button" class="btn-close" aria-label="Close form" (click)="cancel.emit()"></button>
  </div>

  <div class="row g-3">
    <div class="col-12 col-lg-6">
      <label class="form-label" for="task-title">Title <sup>*</sup></label>
      <input
        id="task-title"
        type="text"
        class="form-control"
        formControlName="title"
        [class.is-invalid]="form.controls.title.touched && form.controls.title.invalid"
      >
      @if (form.controls.title.touched && form.controls.title.invalid) {
        <div class="invalid-feedback">Title is required.</div>
      }
    </div>

    <div class="col-12 col-lg-6">
      <label class="form-label" for="task-due-date">Due date</label>
      <input id="task-due-date" type="date" class="form-control" formControlName="dueDate">
    </div>

    <div class="col-12">
      <label class="form-label" for="task-description">Description</label>
      <textarea
        id="task-description"
        class="form-control"
        rows="3"
        formControlName="description"
      ></textarea>
    </div>

    <fieldset class="col-12 col-lg-6">
      <legend class="form-label">Status</legend>
      <div class="task-form__options">
        @for (status of statuses; track status) {
          <label class="form-check">
            <input class="form-check-input" type="radio" formControlName="status" [value]="status">
            <span class="form-check-label">{{ status }}</span>
          </label>
        }
      </div>
    </fieldset>

    <fieldset class="col-12 col-lg-6">
      <legend class="form-label">Priority</legend>
      <div class="task-form__options">
        @for (priority of priorities; track priority) {
          <label class="form-check">
            <input class="form-check-input" type="radio" formControlName="priority" [value]="priority">
            <span class="form-check-label">{{ priority }}</span>
          </label>
        }
      </div>
    </fieldset>
  </div>

  <div class="task-form__actions">
    <button type="button" class="btn btn-outline-secondary" (click)="cancel.emit()">Cancel</button>
    <button type="submit" class="btn btn-primary">{{ submitLabel() }}</button>
  </div>
</form>
