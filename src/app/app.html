<div class="app-shell">
  <header class="app-header">
    <div class="brand">
      <div>
        <a href="#">
          <img src="/images/logo.jpeg" alt="logo">
        </a>
      </div>
    </div>

    <section class="user-summary" aria-label="User summary">
      <div>
        <span class="user-summary__label">Hallo,</span>
        <strong>John Smith</strong>
      </div>
      <div class="user-summary__status">
        <span class="user-summary__label">Status Ihrer Identifizierung</span>
        <strong>Identifiziert</strong>
      </div>
    </section>
  </header>

  <app-navigation
    [activeItem]="activeNavigationItem()"
    (itemSelected)="selectNavigationItem($event)"
  />

  <main class="app-main">
    @if (activeNavigationItem() === 'task-manager') {
      <section class="content-panel" aria-labelledby="task-manager-heading">
        <div class="content-panel__header">
          <div>
            <p class="eyebrow">Dashboard</p>
            <h1 id="task-manager-heading">Task Manager</h1>
          </div>
          <button type="button" class="btn btn-primary" disabled>Add Task</button>
        </div>

        <app-task-list [tasks]="tasks()" />
      </section>
    }
  </main>
</div>
