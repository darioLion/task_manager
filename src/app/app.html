<div class="app-shell">
  <header class="app-header">
    <div class="brand">
      <div>
        <a href="#">
          <img src="/images/logo.jpeg" alt="logo">
        </a>
      </div>
    </div>

    <section class="user-summary" aria-label="User summary">
      <div class="user-summary__name">
        <span class="user-summary__label">Hallo,</span>
        <strong>John Smith</strong>
      </div>
      <div class="user-summary__status">
        <span class="user-summary__label">Status Ihrer Identifizierung</span>
        <strong>Identifiziert</strong>
      </div>
    </section>
  </header>

  <app-navigation
    [activeItem]="activeNavigationItem()"
    (itemSelected)="selectNavigationItem($event)"
  />

  <main class="app-main">
    @if (activeNavigationItem() === 'task-manager') {
      <app-task-manager />
    } @else {
      <section class="empty-section" [attr.aria-labelledby]="activeNavigationItem() + '-heading'">
        <p class="empty-section__eyebrow">Section</p>
        <h1 [id]="activeNavigationItem() + '-heading'">
          {{ navigationTitleById[activeNavigationItem()] }}
        </h1>
      </section>
    }
  </main>
</div>
